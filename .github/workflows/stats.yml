name: Update stats card

on:
  schedule:
    - cron: "0 6 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_stats.py
      - .github/workflows/stats.yml

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate assets/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a fine-grained PAT with read access to your private repos
          # so their languages count too. Falls back to public repos only.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python scripts/generate_stats.py
      - name: Commit if changed
        run: |
          git diff --quiet -- assets/stats.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "Update stats card"
          git push
